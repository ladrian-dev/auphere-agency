# Puertas de calidad de action-plan-v3 §11.4 — todas bloqueantes.
name: CI

on:
  push:
    # `develop` alimenta landing-staging.auphere.com: las puertas corren antes
    # de que el equipo vea nada, igual que en main.
    branches: [main, develop]
  pull_request:

jobs:
  gates:
    name: Typecheck · Lint · Claims · Blacklist · i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Claims (§5 — ningún claim blocked/dated afirmado)
        run: pnpm check:claims
      - name: Blacklist de copy (§4.4 — art. 50, hype, enterprise-grade)
        run: pnpm check:blacklist
      - name: Paridad i18n
        run: pnpm check:i18n

  build:
    name: Build + Lighthouse + axe
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Start server
        run: pnpm start &
      - name: Wait for server
        run: npx wait-on http://localhost:3000/en --timeout 60000
      - name: Lighthouse CI (thresholds §7.3)
        run: pnpm dlx @lhci/cli@0.15.x autorun
      - name: axe-core (WCAG 2.2 AA, 6 rutas)
        run: |
          pnpm dlx @axe-core/cli@4.10.x \
            http://localhost:3000/en \
            http://localhost:3000/es \
            http://localhost:3000/en/enterprise \
            http://localhost:3000/en/partners \
            http://localhost:3000/en/trust \
            http://localhost:3000/es/use-cases/barbershop \
            --exit
